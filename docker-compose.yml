# Optional: PostgreSQL for local development.
#   docker compose up -d
# then set in backend/.env:
#   DATABASE_URL=postgresql://vortex:vortex@localhost:5432/vortex
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - "5432:5432"
    volumes:
      - vortex-db:/var/lib/postgresql/data
volumes:
  vortex-db:
